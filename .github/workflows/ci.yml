name: CI

on:
  push:

env:
  CARAFE_TEST_VERSION: "2.0.0"

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure test script is executable
        run: chmod +x build.sh test/test_carafe_image.sh

      - name: Build image and run Carafe smoke test
        run: ./test/test_carafe_image.sh "${CARAFE_TEST_VERSION}"
